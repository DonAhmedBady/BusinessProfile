<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Profile — Access Badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --void: #05060d;
    --void-2: #0a0f1e;
    --panel: rgba(11, 17, 34, 0.72);
    --cyan: #00e5ff;
    --cyan-dim: rgba(0, 229, 255, 0.16);
    --violet: #7b2ff7;
    --amber: #ffb020;
    --success: #00ff9d;
    --slate: #8291a8;
    --line: rgba(0, 229, 255, 0.16);
    --text: #eaf2f8;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100vh;
}

body {
    background: var(--void);
    background-image:
        radial-gradient(circle at 15% 20%, rgba(123, 47, 247, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(0, 229, 255, 0.12) 0%, transparent 45%),
        repeating-linear-gradient(0deg, rgba(0, 229, 255, 0.025) 0px, rgba(0, 229, 255, 0.025) 1px, transparent 1px, transparent 42px),
        repeating-linear-gradient(90deg, rgba(0, 229, 255, 0.025) 0px, rgba(0, 229, 255, 0.025) 1px, transparent 1px, transparent 42px);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    color: var(--text);
}

.profile-card {
    position: relative;
    background: var(--panel);
    backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,229,255,0.04);
    overflow: hidden;
}

/* corner ticks on the whole card */
.profile-card::before, .profile-card::after,
.corner-tl, .corner-tr, .corner-bl, .corner-br {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--cyan);
    z-index: 20;
    opacity: 0.85;
}
.corner-tl { top: 8px; left: 8px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.corner-tr { top: 8px; right: 8px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
.corner-bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

.header-visual {
    height: 128px;
    position: relative;
    background:
        linear-gradient(180deg, rgba(5,6,13,0) 0%, var(--void-2) 100%),
        repeating-linear-gradient(115deg, rgba(0,229,255,0.05) 0px, rgba(0,229,255,0.05) 2px, transparent 2px, transparent 18px),
        linear-gradient(135deg, #0d1730 0%, #120a26 100%);
    overflow: hidden;
}

.scanline {
    position: absolute;
    left: 0; right: 0;
    height: 40px;
    background: linear-gradient(180deg, transparent, rgba(0,229,255,0.35), transparent);
    animation: sweep 3.2s linear infinite;
    filter: blur(1px);
}
@keyframes sweep {
    0% { top: -40px; }
    100% { top: 128px; }
}

.clearance-tag {
    position: absolute;
    top: 14px;
    left: 20px;
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    color: var(--amber);
    border: 1px solid rgba(255, 176, 32, 0.35);
    background: rgba(255, 176, 32, 0.08);
    padding: 3px 8px;
    border-radius: 2px;
    z-index: 15;
}

.status-tag {
    position: absolute;
    top: 14px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    color: var(--success);
    z-index: 15;
}
.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 0 rgba(0,255,157,0.6);
    animation: pulse 1.8s ease-out infinite;
}
@keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,255,157,0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(0,255,157,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,255,157,0); }
}

.photo-frame {
    position: relative;
    width: 128px;
    height: 128px;
    margin: -64px auto 0;
    z-index: 12;
}

.profile-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #10162a;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
}

.photo-frame::before {
    content: '';
    position: absolute;
    inset: -6px;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    padding: 2px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.9;
}

.content { padding: 14px 30px 32px; }

h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    margin: 14px 0 4px;
}

.title {
    font-family: 'Space Mono', monospace;
    color: var(--cyan);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.company-link {
    color: var(--slate);
    text-decoration: none;
    font-size: 0.82rem;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.company-link:hover { color: var(--cyan); }

.divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
    margin: 18px 0;
}

.bio {
    font-size: 0.85rem;
    color: var(--slate);
    line-height: 1.65;
    margin: 0;
    text-align: left;
}

.modules-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    color: var(--slate);
    text-align: left;
    margin-bottom: 10px;
    opacity: 0.75;
}

.skills-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
}

.skill-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--cyan-dim);
    color: var(--cyan);
    padding: 5px 10px;
    border-radius: 2px;
    font-size: 0.68rem;
    font-family: 'Space Mono', monospace;
    border: 1px solid rgba(0, 212, 255, 0.25);
    letter-spacing: 0.4px;
}
.skill-tag::before {
    content: '◆';
    font-size: 0.5rem;
    color: var(--violet);
}

.actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 22px;
}

.btn {
    padding: 13px;
    border-radius: 2px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    font-size: 0.78rem;
    font-family: 'Space Mono', monospace;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: none;
}

.btn-primary {
    background: var(--cyan);
    color: var(--void);
}
.btn-primary:hover {
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.45);
    transform: translateY(-1px);
}

.btn-outline {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text);
}
.btn-outline:hover {
    border-color: var(--cyan);
    color: var(--cyan);
}

.badge-id {
    margin-top: 18px;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--slate);
    letter-spacing: 1px;
    opacity: 0.7;
}
.badge-id span { color: var(--cyan); }
</style>
</head>

<body>

<div id="app"></div>

<script>
// Demo record used only if employees.json can't be fetched (e.g. local preview).
const DEMO_EMPLOYEE = {
    id: "demo",
    badgeId: "CX-4471-RUH",
    clearance: "CLR-04",
    image: "https://api.dicebear.com/7.x/shapes/svg?seed=cyberx",
    cover: "",
    name: "Ahmed Hassan",
    position: "Cybersecurity Specialist",
    company: "CyberX Intelligence",
    website: "https://cyberx.sa",
    bio: "Securing internal infrastructure, email systems, and staff tooling. Focused on threat prevention and building practical security tools.",
    skills: ["Network Security", "C# / .NET", "Email Auth (SPF/DKIM/DMARC)", "Windows Internals", "Python"],
    linkedin: "#",
    vCard: ""
};

async function loadEmployees() {
    const res = await fetch('employees.json');
    if (!res.ok) throw new Error('Failed to load employees');
    return res.json();
}

function createProfile(employee) {

    const card = document.createElement('div');
    card.className = 'profile-card';

    card.innerHTML = `
        <span class="corner-tl"></span>
        <span class="corner-tr"></span>
        <span class="corner-bl"></span>
        <span class="corner-br"></span>
        <div class="header-visual">
            <div class="scanline"></div>
            <div class="clearance-tag"></div>
            <div class="status-tag"><span class="status-dot"></span>ACTIVE</div>
        </div>
        <div class="content">
            <div class="photo-frame">
                <img class="profile-img" alt="">
            </div>
            <h1></h1>
            <div class="title"></div>
            <a class="company-link" target="_blank"></a>
            <div class="divider"></div>
            <p class="bio"></p>
            <div class="divider"></div>
            <div class="modules-label">// ACCESS MODULES</div>
            <div class="skills-container"></div>
            <div class="actions">
                <a class="btn btn-primary" target="_blank">Connect on LinkedIn</a>
                <button class="btn btn-outline">Download Contact</button>
            </div>
            <div class="badge-id">ID <span></span></div>
        </div>
    `;

    // Header cover
    if (employee.cover) {
        card.querySelector('.header-visual').style.backgroundImage = `url('${employee.cover}')`;
        card.querySelector('.header-visual').style.backgroundSize = 'cover';
        card.querySelector('.header-visual').style.backgroundPosition = 'center';
    }

    card.querySelector('.clearance-tag').textContent = employee.clearance || 'CLR-01';

    // Profile image
    const img = card.querySelector('.profile-img');
    img.src = employee.image;
    img.alt = employee.name;

    // Basic info
    card.querySelector('h1').textContent = employee.name;
    card.querySelector('.title').textContent = employee.position;
    card.querySelector('.company-link').textContent = employee.company + ' ↗';
    card.querySelector('.company-link').href = employee.website || "#";
    card.querySelector('.bio').textContent = employee.bio || "";

    // Skills / access modules
    const skillsContainer = card.querySelector('.skills-container');
    (employee.skills || []).forEach(skill => {
        const span = document.createElement('span');
        span.className = 'skill-tag';
        span.textContent = skill;
        skillsContainer.appendChild(span);
    });

    // LinkedIn button
    card.querySelector('.btn-primary').href = employee.linkedin || "#";

    // Badge ID
    card.querySelector('.badge-id span').textContent = employee.badgeId || employee.id || '—';

    // Download vCard button for GitHub Pages
    const downloadBtn = card.querySelector('.btn-outline');
    downloadBtn.addEventListener('click', () => {
        if (!employee.vCard) return;

        // Use a relative path so it stays within your GitHub repo folder
        const fileUrl = `./${employee.vCard}`;

        const link = document.createElement('a');
        link.href = fileUrl;
        link.download = employee.vCard; // Suggests the filename to the browser

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    return card;
}

(async function init() {
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);
    const empId = params.get('id');

    try {
        const employees = await loadEmployees();
        const employee = empId
            ? employees.find(e => e.id === empId)
            : employees[0];

        if (!employee) {
            app.textContent = "Employee not found.";
            return;
        }

        app.appendChild(createProfile(employee));

    } catch (err) {
        // Fallback so the template still renders (e.g. local preview, no employees.json yet)
        app.appendChild(createProfile(DEMO_EMPLOYEE));
        console.warn('employees.json not found — showing demo profile.', err);
    }
})();
</script>

</body>
</html>
